<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Espacio para una fotografía</title>
  <desc id="desc">Marcador de posición. Sustituye este archivo por una foto real de la pareja.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b10"/>
      <stop offset="100%" stop-color="#3a1520"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g fill="none" stroke="#c4a574" stroke-width="1.5" opacity="0.55">
    <rect x="48" y="48" width="704" height="904" rx="28"/>
  </g>
  <g fill="#d4a5b0" opacity="0.85">
    <path d="M400 430c-28 0-50 22-50 50 0 44 50 78 50 78s50-34 50-78c0-28-22-50-50-50zm0 28a22 22 0 1 1 0 44 22 22 0 0 1 0-44z"/>
